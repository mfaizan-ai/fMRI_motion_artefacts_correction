# Original-repo-style figures comparing pipeline QC (scripts/pipeline_qc.py outputs) across sources
defaults:
  - paths: maguire
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

qc_root: ${paths.repo_root}/motion_denoising_qc
sources:                   # plot order
  - original_data
  - motion_corrected_st_v4
  - motion_corrected_stv6_convlstm_first_run_video_data
  - motion_corrected_st_fc_beta_v1
labels: [Raw, stv4, stv6_convlstm, st_fc_beta_v1]  # one plot label per source
colors: ["#CC6677", "#DDAA33", "#4477AA", "#AA4499"]  # one colour per source (Paul Tol, colour-blind safe)
comparison_name: raw_vs_stv4_vs_stv6_vs_st_fc_beta_v1
output_dir: ${qc_root}/figures/${comparison_name}
centroids_csv: ${paths.schaefer_mni_centroids_csv}
dpi: 200

fc_top_percent: 2          # FC glass brain: draw only the strongest 2% of significant edges by |mean z|

distribution:              # Ciric-style QC-FC density, one panel per source
  panel_width: 5
  panel_height: 3.6
  kde_points: 500
  fill_alpha: 0.6
  title_size: 14
  text_size: 11

matrix:
  panel_size: 5
  wspace: 0.12
  title_size: 13

colorbar:                  # drawn beside the last panel, as tall as its matrix or glass brain
  pad: 0.01                # gap to the panel, in figure width
  width: 0.012
  label_size: 11

distance:                  # density contours stand in for the original seaborn KDE
  panel_width: 5.5
  panel_height: 4.5
  bins: 150
  smooth_sigma: 3          # Gaussian smoothing of the 2-D histogram, in bins
  levels: 10
  density_floor: 0.03      # lowest contour, as a fraction of peak density (seaborn thresh)

modularity:
  box_width_inches: 2.2
  height: 5
  edge: "#333333"
  box_alpha: 0.7

connectome:                # QC-FC and FC edge glass brains, one panel per source
  display_mode: x          # sagittal
  panel_size: [5.6, 4.6]
  title_space: 0.08        # share of the figure height kept for panel titles
  title_size: 12
  node_color: "#333333"
  node_size: 10
  qcfc_edge_width: 2.2

hydra:
  run:
    dir: ${output_dir}
  output_subdir: null
  job:
    chdir: false
