# Test-split metrics by grade for a trained checkpoint
defaults:
  - paths: maguire
  - data: grade
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

checkpoint: ???
output_dir: ???          # e.g. ${paths.runs_root}/st_v4/test
device: cuda

hydra:
  run:
    dir: ${output_dir}
  output_subdir: null
  job:
    chdir: false
