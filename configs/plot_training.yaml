# Training curves from a run's train_losses.csv / val_metrics.csv (this repo's or the original repo's trainer)
defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

run_dir: ???               # folder holding train_losses.csv and val_metrics.csv
train_csv: ${run_dir}/train_losses.csv
val_csv: ${run_dir}/val_metrics.csv
output_dir: ???            # figures are written here (keep it out of the original repo, which is read-only)
title: null                # figure-title prefix, e.g. the run name; null uses the run_dir folder name
dpi: 300
smooth_window: 5           # epochs in the centred rolling mean drawn over the raw curve
log_scale: [D_r1]          # columns spanning orders of magnitude (R1 starts in the hundreds)

# column -> panel title; columns missing from a CSV (e.g. no ROI or beta loss in that run) are skipped
generator:
  G_adv: Adversarial
  G_cyc: Cycle consistency
  G_idt: Identity
  G_roi_adv: ROI adversarial
  G_roi_cycle: ROI time-series cycle
  G_beta: Huber loss
  G_total: Total generator
discriminator:
  D_A: Discriminator A
  D_B: Discriminator B
  D_roi_total: ROI discriminator
  D_r1: R1 penalty
validation:
  val_score: Validation score
  val_tsnr_improvement: tSNR improvement
  val_dvars_improvement: DVARS improvement
  val_gs_std_improvement: Global signal std improvement
  val_cyc: Validation cycle
  val_idt: Validation identity
  val_beta_loss: Validation Huber loss

style:
  ncols: 4
  panel_size: [4.2, 3.0]
  raw_alpha: 0.35
  line_width: 2
  marker_size: 4           # validation points (logged every few epochs)
  title_size: 12
  label_size: 10
  tick_size: 9

colors:                    # dataviz reference palette, ink tokens for text
  # categorical slots 1-8 in fixed order; panel i of a group takes slot i
  series: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]
  grid: "#e6e6e3"
  axis: "#a3a29d"
  text_primary: "#0b0b0b"
  text_secondary: "#52514e"

hydra:
  run:
    dir: ${output_dir}
  output_subdir: null
  job:
    chdir: false
