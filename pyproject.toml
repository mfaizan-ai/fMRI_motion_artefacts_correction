[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "moco"
version = "0.1.0"
description = "Disentangled CycleGAN for motion correction of infant fMRI (FoundCog)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "pandas",
    "nibabel",
    "scipy",
    "statsmodels",
    "nilearn",
    "netneurotools",
    "matplotlib",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
